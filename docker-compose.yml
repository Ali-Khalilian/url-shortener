services:

  postgres:
    image: postgres:18
    container_name: url-postgres
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql


  redis:
    image: redis:latest
    container_name: url-redis
    ports:
      - "6379:6379"


  web:
    build:
      context: ./backend

    container_name: url-web

    command:
      gunicorn core.wsgi:application --bind 0.0.0.0:8000

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis


  celery:
    build:
      context: ./backend

    container_name: url-celery

    command:
      celery -A core worker -l info --pool=solo

    volumes:
      - ./backend:/app

    depends_on:
      - redis
      - postgres


  celery-beat:
    build:
      context: ./backend

    container_name: url-celery-beat

    command:
      celery -A core beat -l info

    volumes:
      - ./backend:/app

    depends_on:
      - redis


volumes:

  postgres_data: